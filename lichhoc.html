<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lịch học - StudyHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172b4d;
        }


        /* ================= HEADER ================= */

        .header {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e6eaf0;

            display: flex;
            align-items: center;

            padding: 0 32px;

            position: sticky;
            top: 0;
            z-index: 100;
        }


        /* ================= LOGO ================= */

        .logo {
            width: 245px;

            display: flex;
            align-items: center;

            font-size: 22px;
            font-weight: 700;

            color: #1464d2;
        }


        /* ================= SEARCH ================= */

        .search {
            width: 510px;
        }

        .search input {
            width: 100%;
            height: 42px;

            border: 1px solid #dce7f5;
            border-radius: 8px;

            padding: 0 15px;

            outline: none;

            color: #172b4d;
            font-size: 14px;
        }

        .search input:focus {
            border-color: #1464d2;
        }


        /* ================= LAYOUT ================= */

        .layout {
            display: flex;

            min-height: calc(100vh - 72px);
        }


        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 245px;

            background: white;

            border-right: 1px solid #e6eaf0;

            padding: 25px 14px;

            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 12px;

            font-weight: 700;

            color: #8a96a8;

            padding: 0 16px 15px;

            text-transform: uppercase;
        }

        .menu-item {
            height: 48px;

            border-radius: 8px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            margin-bottom: 5px;

            color: #40516c;

            font-size: 15px;

            transition: 0.2s;

            cursor: pointer;
        }

        .menu-item:hover {
            background: #f0f5fc;
            color: #1464d2;
        }

        .menu-item.active {
            background: #1464d2;
            color: white;

            font-weight: 600;
        }


        /* ================= MAIN ================= */

        .main {
            flex: 1;

            padding: 20px;

            background: #f5faff;

            min-width: 0;
        }


        /* ================= PAGE HEADER ================= */

        .page-header {
            background: linear-gradient(
                110deg,
                #eaf4ff,
                #d8ebff
            );

            border-radius: 12px;

            padding: 20px 22px;

            margin-bottom: 12px;
        }

        .page-title {
            color: #123e78;

            font-size: 30px;

            line-height: 1;

            margin-bottom: 8px;
        }

        .page-description {
            color: #536982;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ================= WEEK CONTROLS ================= */

        .schedule-container {
            background: white;

            border-radius: 12px;

            padding: 16px 20px;
        }


        .week-toolbar {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 16px;
        }


        .week-selector {
            height: 44px;

            min-width: 335px;

            border: 1px solid #dce7f5;

            border-radius: 8px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            overflow: hidden;
        }


        .week-button {
            width: 45px;

            height: 44px;

            border: none;

            background: white;

            color: #1464d2;

            font-size: 20px;

            cursor: pointer;
        }

        .week-button:hover {
            background: #f0f5fc;
        }


        .week-title {
            flex: 1;

            text-align: center;

            color: #173d77;

            font-size: 14px;

            font-weight: 600;
        }


        .view-buttons {
            display: flex;

            gap: 6px;
        }


        .view-button {
            height: 44px;

            padding: 0 18px;

            border: 1px solid #dce7f5;

            border-radius: 8px;

            background: white;

            color: #5274a8;

            font-size: 14px;

            cursor: pointer;
        }


        .view-button.active {
            background: #1464d2;

            border-color: #1464d2;

            color: white;

            font-weight: 600;
        }


        /* ================= WEEK INFO ================= */

        .week-info {
            color: #6f91bd;

            font-size: 13px;

            margin-bottom: 14px;
        }


        /* ================= SCHEDULE GRID ================= */

        .schedule-wrapper {
            width: 100%;

            overflow-x: auto;
        }


        .schedule-grid {
            min-width: 850px;

            display: grid;

            grid-template-columns: 105px repeat(7, minmax(100px, 1fr));

            border-top: 1px solid #e2e8f0;

            border-left: 1px solid #e2e8f0;
        }


        .grid-cell {
            min-height: 82px;

            border-right: 1px solid #e2e8f0;

            border-bottom: 1px solid #e2e8f0;

            background: white;
        }


        /* ================= DAY HEADER ================= */

        .day-header {
            min-height: 68px;

            padding: 13px 8px;

            text-align: center;

            background: #fafcff;

            color: #5274a8;

            font-size: 13px;

            font-weight: 600;
        }


        .day-header.today {
            background: #eef6ff;

            color: #1464d2;
        }


        .day-number {
            display: block;

            margin-top: 6px;

            color: #8290a5;

            font-size: 12px;

            font-weight: 400;
        }


        /* ================= TIME COLUMN ================= */

        .time-header {
            background: #fafcff;
        }

        .time-cell {
            min-height: 82px;

            padding: 13px 10px;

            color: #6f91bd;

            font-size: 12px;

            text-align: center;

            background: #fafcff;
        }


        /* ================= CLASS CELL ================= */

        .class-cell {
            position: relative;

            min-height: 82px;

            padding: 5px;
        }


        .class-item {
            width: 100%;

            min-height: 72px;

            padding: 9px 10px;

            border-radius: 8px;

            background: #eef4ff;

            border: 1px solid #d5e5ff;

            color: #234b82;

            cursor: pointer;

            transition: 0.2s;
        }


        .class-item:hover {
            background: #e3efff;

            border-color: #bcd6ff;
        }


        .class-name {
            font-size: 12px;

            line-height: 1.4;

            font-weight: 600;

            color: #173d77;

            margin-bottom: 5px;
        }


        .class-time {
            font-size: 11px;

            color: #6f91bd;
        }


        /* ================= EMPTY STATE ================= */

        .empty-week {
            display: none;

            padding: 45px 20px;

            text-align: center;

            color: #8290a5;

            font-size: 14px;
        }


        /* ================= MESSAGE ================= */

        #message {
            position: fixed;

            right: 25px;

            bottom: 25px;

            background: #172b4d;

            color: white;

            padding: 13px 18px;

            border-radius: 8px;

            display: none;

            z-index: 300;

            font-size: 13px;
        }


        /* ================= MOBILE MENU ================= */

        .mobile-menu-button {
            display: none;

            position: fixed;

            top: 16px;

            left: 15px;

            width: 40px;

            height: 40px;

            border: 1px solid #dce2eb;

            border-radius: 8px;

            background: white;

            color: #1464d2;

            font-size: 22px;

            z-index: 300;

            align-items: center;

            justify-content: center;

            cursor: pointer;
        }


        .sidebar-overlay {
            display: none;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 180px;
            }

            .sidebar-title {
                padding: 0 12px 15px;
            }

            .menu-item {
                padding: 0 12px;
            }

            .week-toolbar {
                flex-direction: column;

                align-items: stretch;
            }

            .week-selector {
                width: 100%;
            }

            .view-buttons {
                width: 100%;
            }

            .view-button {
                flex: 1;
            }

        }


        @media (max-width: 600px) {

            .mobile-menu-button {
                display: flex;
            }


            .header {
                padding: 0 15px 0 70px;
            }


            .search {
                display: none;
            }


            .logo {
                width: auto;
            }


            .sidebar {
                position: fixed;

                top: 0;

                left: -200px;

                width: 180px;

                height: 100vh;

                padding: 90px 10px 25px;

                z-index: 250;

                transition: left 0.25s ease;

                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.08);
            }


            .sidebar.open {
                left: 0;
            }


            .sidebar-overlay {
                position: fixed;

                inset: 0;

                background: rgba(0, 0, 0, 0.25);

                z-index: 200;
            }


            .sidebar-overlay.open {
                display: block;
            }


            .main {
                padding: 15px;
            }


            .page-title {
                font-size: 24px;
            }


            .schedule-container {
                padding: 14px;
            }


            .week-title {
                font-size: 13px;
            }


            .week-selector {
                min-width: 0;
            }

        }

    </style>

</head>


<body>


<!-- ================= MOBILE MENU ================= -->

<button
    class="mobile-menu-button"
    onclick="toggleSidebar()"
>
    ☰
</button>

<div
    class="sidebar-overlay"
    onclick="toggleSidebar()"
></div>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        StudyHub
    </div>


    <div class="search">

        <input
            type="text"
            placeholder="Tìm kiếm khóa học, bài giảng, tài liệu..."
        >

    </div>

</header>


<!-- ================= LAYOUT ================= -->

<div class="layout">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="sidebar-title">
            Khóa học
        </div>


        <div
            class="menu-item"
            onclick="window.location.href='index.html'"
        >
            Trang chủ
        </div>


        <div class="menu-item active">
            Lịch học
        </div>


        <div
            class="menu-item"
            onclick="window.location.href='hoidap.html'"
        >
            Hỏi đáp
        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


        <!-- ================= PAGE HEADER ================= -->

        <div class="page-header">

            <h1 class="page-title">
                Lịch học
            </h1>

            <p class="page-description">
                Theo dõi lịch học của bạn và không bỏ lỡ bất kỳ buổi học nào.
            </p>

        </div>


        <!-- ================= SCHEDULE ================= -->

        <div class="schedule-container">


            <!-- ================= WEEK TOOLBAR ================= -->

            <div class="week-toolbar">


                <div class="week-selector">

                    <button
                        class="week-button"
                        onclick="previousWeek()"
                    >
                        ‹
                    </button>


                    <div
                        class="week-title"
                        id="weekTitle"
                    >
                        Tuần 17 (26/04 – 02/05/2027)
                    </div>


                    <button
                        class="week-button"
                        onclick="nextWeek()"
                    >
                        ›
                    </button>

                </div>


                <div class="view-buttons">

                    <button
                        class="view-button active"
                    >
                        Tuần
                    </button>

                    <button
                        class="view-button"
                        onclick="showMessage('Chế độ tháng đang được phát triển')"
                    >
                        Tháng
                    </button>

                    <button
                        class="view-button"
                        onclick="showMessage('Chế độ danh sách đang được phát triển')"
                    >
                        Danh sách
                    </button>

                </div>

            </div>


            <div
                class="week-info"
                id="weekInfo"
            >
                Lịch học trong tuần
            </div>


            <!-- ================= GRID ================= -->

            <div class="schedule-wrapper">

                <div
                    class="schedule-grid"
                    id="scheduleGrid"
                >

                </div>

            </div>


            <div
                class="empty-week"
                id="emptyWeek"
            >
                Tuần này không có buổi học.
            </div>


        </div>

    </main>

</div>


<!-- ================= MESSAGE ================= -->

<div id="message"></div>


<script>


/* =========================================================
   DỮ LIỆU LỊCH HỌC
========================================================= */


const lessons = [

    {
        date: "2027-05-02",
        name: "Buổi học 1",
        time: "09:00 – 10:30"
    },

    {
        date: "2027-05-09",
        name: "Buổi học 2",
        time: "09:00 – 10:30"
    },

    {
        date: "2027-05-16",
        name: "Buổi học 3",
        time: "09:00 – 10:30"
    },

    {
        date: "2027-05-23",
        name: "Buổi học 4",
        time: "09:00 – 10:30"
    },

    {
        date: "2027-05-30",
        name: "Buổi học 5",
        time: "09:00 – 10:30"
    },

    {
        date: "2027-06-06",
        name: "Buổi học 6",
        time: "09:00 – 10:30"
    },

    {
        date: "2027-06-13",
        name: "Buổi học 7",
        time: "09:00 – 10:30"
    },

    {
        date: "2027-06-20",
        name: "Buổi học 8",
        time: "09:00 – 10:30"
    }

];


/* =========================================================
   TUẦN HIỆN TẠI
========================================================= */


/*
    Tuần 17:
    Thứ 2 26/04/2027
    đến Chủ nhật 02/05/2027
*/


let currentWeekStart =
    new Date("2027-04-26T00:00:00");


const weekStartOriginal =
    new Date("2027-04-26T00:00:00");


/* =========================================================
   TÊN NGÀY
========================================================= */

const dayNames = [

    "Thứ 2",
    "Thứ 3",
    "Thứ 4",
    "Thứ 5",
    "Thứ 6",
    "Thứ 7",
    "Chủ nhật"

];


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(date) {

    const day =
        String(date.getDate()).padStart(2, "0");

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const year =
        date.getFullYear();

    return `${day}/${month}/${year}`;

}


/* =========================================================
   FORMAT SHORT DATE
========================================================= */

function formatShortDate(date) {

    const day =
        String(date.getDate()).padStart(2, "0");

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    return `${day}/${month}`;

}


/* =========================================================
   GET WEEK NUMBER
========================================================= */

function getWeekNumber(date) {

    const firstWeekStart =
        new Date(2027, 0, 4);

    const difference =
        date.getTime() -
        firstWeekStart.getTime();

    const days =
        Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

    return Math.floor(days / 7) + 2;

}


/* =========================================================
   GET SUNDAY OF WEEK
========================================================= */

function getWeekEnd(startDate) {

    const end =
        new Date(startDate);

    end.setDate(
        end.getDate() + 6
    );

    return end;

}


/* =========================================================
   CHECK SAME DATE
========================================================= */

function isSameDate(date1, date2) {

    return (
        date1.getFullYear() === date2.getFullYear() &&
        date1.getMonth() === date2.getMonth() &&
        date1.getDate() === date2.getDate()
    );

}


/* =========================================================
   FIND LESSON
========================================================= */

function getLessonForDate(date) {

    return lessons.find(function(lesson) {

        const lessonDate =
            new Date(
                lesson.date + "T00:00:00"
            );

        return isSameDate(
            date,
            lessonDate
        );

    });

}


/* =========================================================
   RENDER SCHEDULE
========================================================= */

function renderSchedule() {

    const grid =
        document.getElementById(
            "scheduleGrid"
        );

    grid.innerHTML = "";


    const weekEnd =
        getWeekEnd(
            currentWeekStart
        );


    const weekNumber =
        getWeekNumber(
            currentWeekStart
        );


    /*
        Cập nhật tiêu đề tuần
    */

    document.getElementById(
        "weekTitle"
    ).textContent =
        `Tuần ${weekNumber} (${formatDate(currentWeekStart)} – ${formatDate(weekEnd)})`;


    document.getElementById(
        "weekInfo"
    ).textContent =
        `Lịch học từ ${formatDate(currentWeekStart)} đến ${formatDate(weekEnd)}`;


    /*
        Góc trên cùng
    */

    const emptyCorner =
        document.createElement("div");

    emptyCorner.className =
        "grid-cell time-header";

    grid.appendChild(
        emptyCorner
    );


    /*
        Header 7 ngày
    */

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const date =
            new Date(
                currentWeekStart
            );

        date.setDate(
            date.getDate() + i
        );


        const header =
            document.createElement("div");

        header.className =
            "grid-cell day-header";


        /*
            Chủ nhật có lịch học
            sẽ được làm nổi bật
        */

        const lesson =
            getLessonForDate(
                date
            );

        if (lesson) {

            header.classList.add(
                "today"
            );

        }


        header.innerHTML = `

            ${dayNames[i]}

            <span class="day-number">
                ${formatShortDate(date)}
            </span>

        `;


        grid.appendChild(
            header
        );

    }


    /*
        Các khung giờ
    */

    const timeSlots = [

        "07:00 – 09:00",

        "09:00 – 11:00",

        "11:00 – 13:00",

        "13:00 – 15:00",

        "15:00 – 17:00",

        "17:00 – 19:00",

        "19:00 – 21:00"

    ];


    timeSlots.forEach(
        function(timeSlot, rowIndex) {


            /*
                Cột giờ
            */

            const timeCell =
                document.createElement("div");

            timeCell.className =
                "grid-cell time-cell";

            timeCell.textContent =
                timeSlot;

            grid.appendChild(
                timeCell
            );


            /*
                7 ngày
            */

            for (
                let dayIndex = 0;
                dayIndex < 7;
                dayIndex++
            ) {

                const date =
                    new Date(
                        currentWeekStart
                    );

                date.setDate(
                    date.getDate() +
                    dayIndex
                );


                const cell =
                    document.createElement("div");

                cell.className =
                    "grid-cell class-cell";


                /*
                    Chỉ hiển thị buổi học
                    ở khung 09:00
                */

                const lesson =
                    getLessonForDate(
                        date
                    );


                if (
                    lesson &&
                    rowIndex === 1
                ) {

                    const classItem =
                        document.createElement("div");

                    classItem.className =
                        "class-item";


                    classItem.innerHTML = `

                        <div class="class-name">
                            ${lesson.name}
                        </div>

                        <div class="class-time">
                            ${lesson.time}
                        </div>

                    `;


                    classItem.onclick =
                        function() {

                            showMessage(
                                `${lesson.name}: ${lesson.time}`
                            );

                        };


                    cell.appendChild(
                        classItem
                    );

                }


                grid.appendChild(
                    cell
                );

            }

        }
    );


    /*
        Kiểm tra tuần có lớp không
    */

    const hasLesson =
        lessons.some(
            function(lesson) {

                const date =
                    new Date(
                        lesson.date +
                        "T00:00:00"
                    );

                return (
                    date >= currentWeekStart &&
                    date <= weekEnd
                );

            }
        );


    const emptyWeek =
        document.getElementById(
            "emptyWeek"
        );


    emptyWeek.style.display =
        hasLesson
            ? "none"
            : "block";

}


/* =========================================================
   TUẦN TRƯỚC
========================================================= */

function previousWeek() {

    currentWeekStart.setDate(
        currentWeekStart.getDate() - 7
    );

    renderSchedule();

}


/* =========================================================
   TUẦN SAU
========================================================= */

function nextWeek() {

    currentWeekStart.setDate(
        currentWeekStart.getDate() + 7
    );

    renderSchedule();

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.style.display =
        "block";


    setTimeout(
        function() {

            message.style.display =
                "none";

        },
        2500
    );

}


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

function toggleSidebar() {

    const sidebar =
        document.querySelector(
            ".sidebar"
        );


    const overlay =
        document.querySelector(
            ".sidebar-overlay"
        );


    sidebar.classList.toggle(
        "open"
    );


    overlay.classList.toggle(
        "open"
    );

}


/* =========================================================
   LOAD
========================================================= */

renderSchedule();


</script>

</body>

</html>
