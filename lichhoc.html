<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lịch học - StudyHub</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #172b4d;
}


/* =====================================================
   HEADER
   Đồng bộ với index / hỏi đáp
===================================================== */

.header {
    height: 72px;
    background: white;
    border-bottom: 1px solid #e6eaf0;
    display: flex;
    align-items: center;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 100;
}


/* Logo */

.logo {
    width: 245px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 700;
    color: #1464d2;
    flex-shrink: 0;
}

.logo-mark {
    width: 40px;
    height: 40px;

    border: 3px solid #1464d2;
    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #1464d2;

    font-size: 19px;
    font-weight: bold;
}

.logo-text {
    color: #1464d2;
    font-size: 22px;
    font-weight: 700;
    white-space: nowrap;
}


/* Search */

.search {
    width: 510px;
}

.search input {
    width: 100%;
    height: 42px;

    border: 1px solid #dce7f5;
    border-radius: 8px;

    padding: 0 15px;

    outline: none;

    color: #172b4d;

    font-size: 14px;

    background: #ffffff;
}

.search input::placeholder {
    color: #6f7785;
}

.search input:focus {
    border-color: #1464d2;
}


/* =====================================================
   LAYOUT
===================================================== */

.layout {
    display: flex;
    min-height: calc(100vh - 72px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    width: 245px;

    background: white;

    border-right: 1px solid #e6eaf0;

    padding: 25px 14px;

    flex-shrink: 0;
}

.sidebar-title {
    font-size: 12px;
    font-weight: 700;
    color: #8a96a8;
    padding: 0 16px 15px;
    text-transform: uppercase;
}

.menu-item {
    height: 48px;
    border-radius: 8px;

    display: flex;
    align-items: center;

    padding: 0 16px;
    margin-bottom: 5px;

    color: #40516c;
    font-size: 15px;

    transition: 0.2s;
    cursor: pointer;
}

.menu-item:hover {
    background: #f0f5fc;
    color: #1464d2;
}
.menu-item.active {
    background: #1464d2;
    color: white;
    font-weight: 600;
}


/* =====================================================
   MAIN
===================================================== */

.main {
    flex: 1;

    padding: 20px;

    min-width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        350px;

    gap: 20px;

    background: #f5faff;
}

.schedule-area {
    min-width: 0;
}


/* =====================================================
   HERO
===================================================== */

.schedule-hero {
    background:
        linear-gradient(
            110deg,
            #eaf4ff,
            #d8ebff
        );

    border-radius: 12px;

    padding: 25px 35px;

    margin-bottom: 16px;
}

.schedule-title h1 {
    color: #123e78;

    font-size: 30px;
    line-height: 1.2;
}

.schedule-description {
    margin-top: 9px;

    color: #536982;

    font-size: 16px;

    line-height: 1.5;
}


/* =====================================================
   SCHEDULE CONTAINER
===================================================== */

.schedule-container {
    background: #ffffff;

    border-radius: 12px;

    padding: 20px 24px;

    overflow: hidden;
}


/* =====================================================
   CONTROLS
===================================================== */

.schedule-controls {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 14px;
}


/* Week selector */

.week-selector {
    width: 500px;
    height: 56px;

    border: 1px solid #dce7f5;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #ffffff;

    flex-shrink: 0;
}

.week-arrow {
    width: 52px;
    height: 100%;

    border: none;

    background: transparent;

    color: #1464d2;

    font-size: 25px;

    cursor: pointer;
}

.week-arrow:hover {
    background: #f2f6fc;
}

.week-title {
    flex: 1;

    text-align: center;

    color: #173d77;

    font-size: 16px;

    font-weight: 600;
}


/* View buttons */

.view-buttons {
    display: flex;

    gap: 8px;
}

.view-button {
    height: 56px;

    padding: 0 21px;

    border: 1px solid #dce7f5;

    border-radius: 9px;

    background: #ffffff;

    color: #5274a8;

    font-size: 15px;

    cursor: pointer;

    white-space: nowrap;
}

.view-button:hover {
    background: #f5f8fd;
}

.view-button.active {
    background: #1464d2;

    color: #ffffff;

    border-color: #1464d2;

    font-weight: 600;
}


/* =====================================================
   WEEK INFO
===================================================== */

.week-info {
    color: #6f91bd;

    font-size: 15px;

    margin-bottom: 15px;
}


/* =====================================================
   CALENDAR
===================================================== */

.calendar-wrapper {
    width: 100%;
    overflow-x: hidden;
}

.calendar {
    width: 100%;
    max-width: 100%;
    display: grid;
    grid-template-columns: 70px repeat(7, minmax(0, 1fr));
    overflow: hidden;
    box-sizing: border-box;
}


/* General cell */

.calendar-cell {
    border-right: 1px solid #dce7f5;
    border-bottom: 1px solid #dce7f5;

    background: #ffffff;
}


/* =====================================================
   DAY HEADER
===================================================== */

.day-header {
    min-height: 100px;

    background: #f8fbff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    color: #5274a8;
}

.day-name {
    font-size: 16px;

    font-weight: 700;

    margin-bottom: 7px;
}

.day-date {
    font-size: 14px;

    color: #8290a5;
}


/* Chủ nhật */

.day-header.sunday {
    background: #eef6ff;

    color: #1464d2;
}

.day-header.sunday .day-date {
    color: #5274a8;
}
/* =========================
   LỊCH THÁNG
========================= */

.month-calendar {
    display: none;
}

.month-day-name {
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f8fc;
    border-right: 1px solid #e1e8f0;
    border-bottom: 1px solid #e1e8f0;
    font-size: 13px;
    font-weight: 700;
    color: #40516c;
}

.month-day-name.sunday {
    color: #e14b4b;
}

.month-cell {
    min-height: 120px;
    padding: 8px;
    background: white;
    border-right: 1px solid #e1e8f0;
    border-bottom: 1px solid #e1e8f0;
    box-sizing: border-box;
}

.month-cell.other-month {
    background: #f8fafc;
}

.month-date {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 5px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 600;
    color: #40516c;
}

.month-cell.today .month-date {
    background: #1464d2;
    color: white;
}

.month-cell.sunday .month-date {
    color: #e14b4b;
}

.month-cell.today.sunday .month-date {
    color: white;
}

.month-class {
    padding: 7px;
    margin-top: 4px;
    border-radius: 6px;
    background: #eaf3ff;
    border-left: 3px solid #1464d2;
    overflow: hidden;
}

.month-class-name {
    font-size: 11px;
    line-height: 1.3;
    font-weight: 700;
    color: #1464d2;
    overflow-wrap: anywhere;
}

.month-class-time {
    margin-top: 3px;
    font-size: 10px;
    color: #53647d;
}

/* =====================================================
   TIME COLUMN
===================================================== */

.time-header {
    min-height: 100px;

    background: #f8fbff;
}

.time-cell {
    min-height: 100px;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding-top: 18px;

    text-align: center;

    color: #6f91bd;

    font-size: 14px;

    line-height: 1.45;

    background: #fbfcfe;
}


/* =====================================================
   EMPTY CELL
===================================================== */

.empty-cell {
    min-height: 100px;

    background: #ffffff;
}


/* =====================================================
   CLASS CELL
===================================================== */

.class-cell {
    min-height: 100px;

    padding: 8px;

    position: relative;
}

.class-item {
    min-height: 84px;

    background: #eef4ff;

    border: 1px solid #c9ddff;

    border-radius: 9px;

    padding: 10px 11px;

    cursor: pointer;

    transition: 0.2s ease;
}

.class-item:hover {
    background: #e5efff;

    border-color: #9fc3ff;
}

.class-name {
    color: #173d77;

    font-size: 13px;

    line-height: 1.4;

    font-weight: 600;

    margin-bottom: 7px;
}

.class-session {
    color: #1464d2;

    font-size: 13px;

    font-weight: 600;

    margin-bottom: 5px;
}

.class-time {
    color: #6f91bd;

    font-size: 12px;
}


/* =====================================================
   RIGHT COLUMN
===================================================== */

.right-column {
    display: flex;

    flex-direction: column;

    gap: 24px;

    min-width: 0;
}


/* =====================================================
   SIDE CARD
===================================================== */

.side-card {
    background: #ffffff;

    border: 1px solid #e5e9ef;

    border-radius: 12px;

    padding: 22px;
}

.side-card h2 {
    color: #123e78;

    font-size: 21px;

    margin-bottom: 18px;
}


/* =====================================================
   UPCOMING CLASS
===================================================== */

.upcoming-class {
    border: 1px solid #dce7f5;

    border-radius: 10px;

    padding: 16px;
}

.upcoming-label {
    color: #1464d2;

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 9px;
}

.upcoming-name {
    color: #173d77;

    font-size: 15px;

    font-weight: 600;

    line-height: 1.5;

    margin-bottom: 12px;
}

.upcoming-info {
    color: #6f91bd;

    font-size: 14px;

    line-height: 1.7;
}

.upcoming-session {
    display: inline-block;

    margin-top: 10px;

    padding: 5px 10px;

    background: #eef4ff;

    border-radius: 6px;

    color: #1464d2;

    font-size: 13px;

    font-weight: 600;
}


/* =====================================================
   MOTIVATION
===================================================== */

.motivation-card {
    background:
        linear-gradient(
            135deg,
            #eef9ff,
            #f1fbf5
        );

    border: 1px solid #dceef0;

    border-radius: 12px;

    padding: 22px;
}

.motivation-title {
    color: #1464d2;

    font-size: 19px;

    font-weight: 700;

    margin-bottom: 10px;
}

.motivation-text {
    color: #536982;

    font-size: 14px;

    line-height: 1.7;
}


/* =====================================================
   MESSAGE
===================================================== */

#message {
    position: fixed;

    right: 25px;
    bottom: 25px;

    max-width: 500px;

    background: #172b4d;

    color: #ffffff;

    padding: 13px 18px;

    border-radius: 8px;

    display: none;

    z-index: 300;

    font-size: 13px;

    line-height: 1.5;
}


/* =====================================================
   RESPONSIVE
   Đồng bộ với Hỏi đáp
===================================================== */
.mobile-menu-button {
    display: none;
    position: fixed;
    top: 15px;
    left: 15px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #1464d2;
    font-size: 22px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 300;
}

.sidebar-overlay {
    display: none;
}
@media (max-width: 900px) {

    .sidebar {
        width: 180px;
    }

    .main {
        grid-template-columns: 1fr;
    }

    .right-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .sidebar-title {
        display: block;
        padding: 0 12px 15px;
    }

    .menu-item {
        justify-content: flex-start;
        padding: 0 12px;
    }

    .menu-text {
        display: block;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .mobile-menu-button {
        display: flex;
    }

    .header {
        padding: 0 15px 0 70px;
    }

    .search {
        display: none;
    }

    .sidebar {
        position: fixed;
        top: 0;
        left: -200px;
        width: 180px;
        height: 100vh;
        padding: 90px 10px 25px;
        z-index: 250;
        transition: left 0.25s ease;
        box-shadow: 4px 0 15px rgba(0,0,0,0.08);
    }

    .sidebar.open {
        left: 0;
    }

    .sidebar-title {
        display: block;
        padding: 0 12px 15px;
    }

    .menu-item {
        justify-content: flex-start;
        padding: 0 12px;
    }

    .menu-text {
        display: block;
    }

    .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 200;
}

.sidebar-overlay.open {
    display: block;
}

    .main {
        padding: 15px;
    }

   .schedule-container {
    padding: 15px 12px;
}

.calendar-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: thin;
}

.calendar-wrapper::-webkit-scrollbar {
    height: 6px;
}

    .right-column {
        grid-template-columns: 1fr;
    }

    .schedule-controls {
        flex-direction: column;
        align-items: stretch;
    }

    .week-selector {
        width: 100%;
    }

    .view-buttons {
        width: 100%;
    }

    .view-button {
        flex: 1;
    }
   /* =====================================================
   LỊCH TUẦN TRÊN ĐIỆN THOẠI
   Cho phép cuộn ngang để không bị dồn chữ
===================================================== */

.calendar-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}


/* Chiều rộng lịch cố định trên mobile */

.calendar {
    width: 760px;
    min-width: 760px;

    grid-template-columns:
        55px
        repeat(7, 1fr);

    overflow: visible;
}


/* Ô lịch */

.calendar-cell {
    min-width: 0;
}


/* Header ngày */

.day-header {
    min-height: 80px;

    overflow: hidden;
}

.day-name {

    white-space: nowrap;
}

.day-date {
    font-size: 10px;
    white-space: nowrap;
    margin-top: 4px;
}


/* Cột giờ */

.time-header {
    min-height: 80px;
}

.time-cell {
    min-height: 90px;

    font-size: 10px;

    padding-top: 12px;

    white-space: nowrap;
}


/* Ô trống */

.empty-cell {
    min-height: 90px;
}


/* Ô có lớp */

.class-cell {
    min-height: 90px;

    padding: 5px;

    overflow: visible;
}


/* Thẻ lớp học */

.class-item {
    min-height: 80px;

    padding: 8px;

    border-radius: 7px;

    overflow: hidden;
}


/* Tên lớp */

.class-name {
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 6px;
    overflow-wrap: break-word;
    word-break: normal;
}


/* Buổi học */

.class-session {
    font-size: 10px;
    margin-bottom: 4px;
}


/* Thời gian */

.class-time {
    font-size: 9px;
    white-space: nowrap;
}
   /* =====================================================
   LỊCH THÁNG TRÊN ĐIỆN THOẠI
===================================================== */

.month-calendar {
    width: 700px;

}

}


.month-cell {

}

}


.month-class {

}


.month-class-name {
    font-size: 9px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}


.month-class-time {
    font-size: 9px;
    margin-top: 3px;
}
}
</style>
</head>

</aside>


</main>

</div>

   THỜI GIAN HỌC
===================================================== */

const LESSON_START = "09:30";
const LESSON_END = "11:00";


/* =====================================================
   TUẦN MẶC ĐỊNH
   Thứ 2: 26/04/2027
   Chủ nhật: 02/05/2027
===================================================== */

let currentWeekStart =
    new Date(2027, 3, 26);


/* =====================================================
   TÊN NGÀY
===================================================== */

const dayNames = [

    "Thứ 2",
    "Thứ 3",
    "Thứ 4",
    "Thứ 5",
    "Thứ 6",
    "Thứ 7",
    "Chủ nhật"

];


/* =====================================================
   KHUNG GIỜ
===================================================== */

const timeSlots = [

    {
        start: "07:00",
        end: "09:00"
    },

    {
        start: "09:00",
        end: "11:00"
    },

    {
        start: "11:00",
        end: "13:00"
    },

    {
        start: "13:00",
        end: "15:00"
    },

    {
        start: "15:00",
        end: "17:00"
    },

    {
        start: "17:00",
        end: "19:00"
    },

    {
        start: "19:00",
        end: "21:00"
    }

];


/* =====================================================
   FORMAT DATE
   Không dùng toISOString()
   để tránh lỗi lệch ngày do timezone
===================================================== */

function formatDate(date) {

    const day =
        String(date.getDate()).padStart(2, "0");

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const year =
        date.getFullYear();

    return `${day}/${month}/${year}`;
}


/* =====================================================
   DATE KEY
===================================================== */

function getDateKey(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const day =
        String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =====================================================
   PARSE LESSON DATE
===================================================== */

function parseLessonDate(dateString) {

    const parts =
        dateString.split("-");

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

}


/* =====================================================
   TÌM BUỔI HỌC
===================================================== */

function getLesson(date) {

    const dateString =
        getDateKey(date);

    return lessons.find(function(lesson) {

        return lesson.date === dateString;

    });

}


/* =====================================================
   SỐ TUẦN
   Giữ cách đánh số giống giao diện hiện tại:
   26/04/2027 – 02/05/2027 = Tuần 18
===================================================== */

function getWeekNumber(date) {

    const firstDay =
        new Date(date.getFullYear(), 0, 1);

    const difference =
        Math.floor(
            (
                date - firstDay
            ) / 86400000
        );

    return Math.ceil(
        (
            difference +
            firstDay.getDay() +
            1
        ) / 7
    );

}

/* =====================================================
   RENDER CALENDAR TUẦN
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";


    /* -----------------------------------------------
       GÓC TRÊN CÙNG
    ----------------------------------------------- */

    const emptyHeader =
        document.createElement("div");

    emptyHeader.className =
        "calendar-cell time-header";

    calendar.appendChild(emptyHeader);


    /* -----------------------------------------------
       7 NGÀY
    ----------------------------------------------- */

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const date =
            new Date(currentWeekStart);

        date.setDate(
            currentWeekStart.getDate() + i
        );


        const header =
            document.createElement("div");

        header.className =
            "calendar-cell day-header";


        if (i === 6) {
            header.classList.add("sunday");
        }


        header.innerHTML = `

            <div class="day-name">
                ${dayNames[i]}
            </div>

            <div class="day-date">
                ${formatDate(date)}
            </div>

        `;


        calendar.appendChild(header);

    }


    /* -----------------------------------------------
       CÁC KHUNG GIỜ
    ----------------------------------------------- */

    timeSlots.forEach(function(slot) {


        /* CỘT GIỜ */

        const timeCell =
            document.createElement("div");

        timeCell.className =
            "calendar-cell time-cell";

        timeCell.innerHTML = `
            ${slot.start} –<br>
            ${slot.end}
        `;

        calendar.appendChild(timeCell);


        /* 7 NGÀY */

        for (
            let day = 0;
            day < 7;
            day++
        ) {

            const date =
                new Date(currentWeekStart);

            date.setDate(
                currentWeekStart.getDate() + day
            );


            const cell =
                document.createElement("div");

            cell.className =
                "calendar-cell empty-cell";


            const lesson =
                getLesson(date);


            /*
             * Buổi học 09:30–11:00
             * nằm trong khung 09:00–11:00
             */

            if (
                lesson &&
                slot.start === "09:00" &&
                day === 6
            ) {

                cell.className =
                    "calendar-cell class-cell";


                cell.innerHTML = `

                    <div
                        class="class-item"
                        onclick="showLesson(${lesson.session})"
                    >

                        <div class="class-name">
                            Đào tạo năng lực số & AI
                        </div>

                        <div class="class-session">
                            Buổi học ${lesson.session}
                        </div>

                        <div class="class-time">
                            ${LESSON_START} – ${LESSON_END}
                        </div>

                    </div>

                `;

            }


            calendar.appendChild(cell);

        }

    });


    updateWeekInformation();

}


/* =====================================================
   RENDER LỊCH THÁNG
===================================================== */

function renderMonthCalendar() {

    const monthCalendar =
        document.getElementById("monthCalendar");

    const currentDate =
        new Date(currentWeekStart);

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    /* Ngày đầu tháng */

    const firstDay =
        new Date(year, month, 1);


    /*
     * CSS lịch bắt đầu từ Thứ 2
     *
     * JS:
     * Chủ nhật = 0
     * Thứ 2 = 1
     * ...
     * Thứ 7 = 6
     */

    let startDay =
        firstDay.getDay();

    startDay =
        startDay === 0
            ? 6
            : startDay - 1;


    /* Ngày cuối tháng */

    const lastDay =
        new Date(year, month + 1, 0);

    const daysInMonth =
        lastDay.getDate();


    /*
     * Luôn đủ số ô để tạo các hàng hoàn chỉnh
     */

    const totalCells =
        Math.ceil(
            (startDay + daysInMonth) / 7
        ) * 7;


    let html = "";


    /* -----------------------------------------------
       TÊN NGÀY
    ----------------------------------------------- */

    dayNames.forEach(function(day, index) {

        html += `

            <div
                class="month-day-name
                ${index === 6 ? "sunday" : ""}"
            >
                ${day}
            </div>

        `;

    });


    /* -----------------------------------------------
       NGÀY TRONG THÁNG
    ----------------------------------------------- */

    for (
        let i = 0;
        i < totalCells;
        i++
    ) {

        const dayNumber =
            i - startDay + 1;


        /*
         * Ô trống trước / sau tháng
         */

        if (
            dayNumber < 1 ||
            dayNumber > daysInMonth
        ) {

            html += `
                <div class="month-cell other-month"></div>
            `;

            continue;

        }


        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const isSunday =
            date.getDay() === 0;


        const lesson =
            getLesson(date);


        html += `

            <div class="
                month-cell
                ${isSunday ? "sunday" : ""}
            ">

                <div class="month-date">
                    ${dayNumber}
                </div>

        `;


        /* -------------------------------------------
           CÓ BUỔI HỌC
        ------------------------------------------- */

        if (lesson) {

            html += `

                <div
                    class="month-class"
                    onclick="showLesson(${lesson.session})"
                >

                    <div class="month-class-name">
                        Buổi học ${lesson.session}
                    </div>

                    <div class="month-class-time">
                        ${LESSON_START} – ${LESSON_END}
                    </div>

                </div>

            `;

        }


        html += `

            </div>

        `;

    }


    monthCalendar.innerHTML =
        html;

}


/* =====================================================
   UPDATE WEEK
===================================================== */

function updateWeekInformation() {

    const weekTitle =
        document.getElementById("week-title");

    const weekInfo =
        document.getElementById("week-info");


    const weekEnd =
        new Date(currentWeekStart);

    weekEnd.setDate(
        currentWeekStart.getDate() + 6
    );


    const weekNumber =
        getWeekNumber(currentWeekStart);


    weekTitle.textContent =
        `Tuần ${weekNumber} (${formatDate(currentWeekStart)} – ${formatDate(weekEnd)})`;


    weekInfo.textContent =
        `Lịch học từ ${formatDate(currentWeekStart)} đến ${formatDate(weekEnd)}`;


    updateUpcomingClass();

}

/* =====================================================
   CHUYỂN TUẦN / THÁNG BẰNG NÚT ‹ ›
===================================================== */

function changeWeek(direction) {

    const monthCalendar =
        document.getElementById("monthCalendar");


    /* =================================================
       NẾU ĐANG Ở CHẾ ĐỘ THÁNG
       
       ‹ = tháng trước
       › = tháng sau
    ================================================= */

    if (
        monthCalendar.style.display === "grid"
    ) {

        currentWeekStart =
            new Date(
                currentWeekStart.getFullYear(),
                currentWeekStart.getMonth() + direction,
                1
            );


        renderMonthCalendar();


        /*
         * Đổi tiêu đề thành:
         * Tháng 05/2027
         */

        const month =
            currentWeekStart.getMonth() + 1;

        const year =
            currentWeekStart.getFullYear();


        document.getElementById("week-title").textContent =
            `Tháng ${String(month).padStart(2, "0")}/${year}`;


        document.getElementById("week-info").textContent =
            `Lịch học tháng ${String(month).padStart(2, "0")}/${year}`;


        return;
    }


    /* =================================================
       NẾU ĐANG Ở CHẾ ĐỘ TUẦN
       
       ‹ = tuần trước
       › = tuần sau
    ================================================= */

    currentWeekStart.setDate(
        currentWeekStart.getDate() +
        direction * 7
    );


    renderCalendar();

}


/* =====================================================
   LỚP HỌC SẮP TỚI
===================================================== */

function updateUpcomingClass() {

    const container =
        document.getElementById("upcoming-class");


    /*
     * Mốc hiện tại của giao diện.
     * Buổi đầu tiên là 02/05/2027.
     */

    const today =
        new Date(2027, 3, 26);


    let nextLesson = null;


    for (
        let i = 0;
        i < lessons.length;
        i++
    ) {

        const lessonDate =
            parseLessonDate(
                lessons[i].date
            );


        if (lessonDate >= today) {

            nextLesson =
                lessons[i];

            break;

        }

    }


    /* Nếu đã hoàn thành */

    if (!nextLesson) {

        container.innerHTML = `

            <div class="upcoming-label">
                Hoàn thành
            </div>

            <div class="upcoming-name">
                Bạn đã hoàn thành toàn bộ 8 buổi học.
            </div>

        `;

        return;

    }


    const lessonDate =
        parseLessonDate(
            nextLesson.date
        );


    container.innerHTML = `

        <div class="upcoming-label">
            Buổi học sắp tới
        </div>

        <div class="upcoming-name">
            ${CLASS_NAME}
        </div>

        <div class="upcoming-info">

            ${LESSON_START} – ${LESSON_END}

            <br>

            Chủ nhật, ${formatDate(lessonDate)}

        </div>

        <div class="upcoming-session">
            Buổi học ${nextLesson.session}
        </div>

    `;

}


/* =====================================================
   CLICK BUỔI HỌC
===================================================== */

function showLesson(session) {

    const lesson =
        lessons.find(function(item) {

            return item.session === session;

        });


    if (!lesson) {
        return;
    }


    const date =
        parseLessonDate(
            lesson.date
        );


    showMessage(
        `${CLASS_NAME} — Buổi học ${session} — ${formatDate(date)} — ${LESSON_START}–${LESSON_END}`
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

    const message =
        document.getElementById("message");


    message.textContent =
        text;


    message.style.display =
        "block";


    clearTimeout(
        window.messageTimeout
    );


    window.messageTimeout =
        setTimeout(function() {

            message.style.display =
                "none";

        }, 3500);

}
/* =====================================================
   CHUYỂN CHẾ ĐỘ TUẦN / THÁNG
===================================================== */

function setView(view) {

    const calendar =
        document.getElementById("calendar");

    const monthCalendar =
        document.getElementById("monthCalendar");

    const buttons =
        document.querySelectorAll(".view-button");


    /* =================================================
       BỎ ACTIVE Ở TẤT CẢ NÚT
    ================================================= */

    buttons.forEach(function(button) {

        button.classList.remove("active");

    });


    /* =================================================
       CHẾ ĐỘ TUẦN
    ================================================= */

    if (view === "week") {

    calendar.style.display =
        "grid";

    monthCalendar.style.display =
        "none";


    buttons[0].classList.add("active");


    /* Đưa currentWeekStart về Thứ 2 */

    const day =
        currentWeekStart.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    currentWeekStart.setDate(
        currentWeekStart.getDate() + diff
    );


    renderCalendar();

    return;
}


    /* =================================================
       CHẾ ĐỘ THÁNG
    ================================================= */

    if (view === "month") {

        calendar.style.display =
            "none";

        monthCalendar.style.display =
            "grid";


        buttons[1].classList.add("active");


        renderMonthCalendar();


        /*
         * Đổi tiêu đề
         */

        const month =
            currentWeekStart.getMonth() + 1;

        const year =
            currentWeekStart.getFullYear();


        document.getElementById("week-title").textContent =
            `Tháng ${String(month).padStart(2, "0")}/${year}`;


        document.getElementById("week-info").textContent =
            `Lịch học tháng ${String(month).padStart(2, "0")}/${year}`;

    }

}

/* =====================================================
   KHỞI TẠO
===================================================== */

function toggleSidebar() {

    const sidebar =
        document.querySelector(".sidebar");

    const overlay =
        document.querySelector(".sidebar-overlay");

    sidebar.classList.toggle("open");

    overlay.classList.toggle("open");
}


renderCalendar();

</script>
