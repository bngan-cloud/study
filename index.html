<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #20232a;
        }

        /* HEADER */

        header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .user {
            background: #f1f3f8;
            padding: 10px 16px;
            border-radius: 20px;
        }


        /* LAYOUT */

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }


        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #e5e5e5;

            padding: 25px 15px;
        }

        .sidebar h3 {
            padding: 10px 15px;
            margin-bottom: 15px;
        }

        .menu {
            padding: 13px 15px;
            margin-bottom: 5px;

            border-radius: 10px;

            cursor: pointer;
        }

        .menu:hover {
            background: #f1f3f8;
        }


        /* MAIN */

        main {
            flex: 1;
            padding: 40px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }


        /* COURSE */

        .course {
            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.05);

            max-width: 900px;
        }

        .course h2 {
            margin-bottom: 10px;
        }

        .progress {
            margin-top: 20px;

            height: 10px;

            background: #e5e7eb;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-bar {
            width: 35%;
            height: 100%;

            background: #6c63ff;
        }


        /* LESSONS */

        .lessons {
            margin-top: 25px;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 15px;
        }

        .lesson {
            border: 1px solid #e5e5e5;

            padding: 20px;

            border-radius: 14px;

            background: white;
        }

        .lesson-number {
            font-size: 13px;
            color: #777;

            margin-bottom: 8px;
        }

        .lesson h3 {
            margin-bottom: 15px;
        }

        button {
            border: none;

            background: #6c63ff;

            color: white;

            padding: 10px 15px;

            border-radius: 8px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

    </style>
</head>


<body>


<header>

    <div class="logo">
        📚 StudyHub
    </div>

    <div class="user">
        👤 Học viên
    </div>

</header>



<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h3>Khóa học</h3>

        <div class="menu">
            🏠 Tổng quan
        </div>

        <div class="menu">
            📚 Bài học
        </div>

        <div class="menu">
            🧪 Mô phỏng
        </div>

        <div class="menu">
            📝 Kiểm tra
        </div>

        <div class="menu">
            📊 Tiến độ
        </div>

    </aside>



    <!-- MAIN -->

    <main>


        <div class="welcome">

            <h1>
                Xin chào 👋
            </h1>

            <p>
                Tiếp tục hành trình học tập của bạn.
            </p>

        </div>



        <div class="course">

            <h2>
                Quản trị Xuất nhập khẩu
            </h2>

            <p>
                Khóa học tương tác
            </p>


            <div class="progress">

                <div class="progress-bar"></div>

            </div>

            <p style="margin-top:8px;">
                Đã hoàn thành 35%
            </p>



            <div class="lessons">


                <div class="lesson">

                    <div class="lesson-number">
                        BUỔI 01
                    </div>

                    <h3>
                        Tổng quan
                    </h3>

                    <button onclick="window.location.href='lesson01.html'">
                        Học bài
                    </button>

                </div>



                <div class="lesson">

                    <div class="lesson-number">
                        BUỔI 02
                    </div>

                    <h3>
                        Hợp đồng
                    </h3>

                    <button>
                        Học bài
                    </button>

                </div>



                <div class="lesson">

                    <div class="lesson-number">
                        BUỔI 03
                    </div>

                    <h3>
                        Thanh toán quốc tế
                    </h3>

                    <button>
                        Học bài
                    </button>

                </div>



                <div class="lesson">

                    <div class="lesson-number">
                        BUỔI 04
                    </div>

                    <h3>
                        Chứng từ
                    </h3>

                    <button>
                        Học bài
                    </button>

                </div>


            </div>


        </div>


    </main>


</div>


</body>
</html>
